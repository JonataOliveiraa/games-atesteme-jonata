# Publica o site de jogos em S3 + CloudFront.
#
# Credenciais por OIDC: o repositório assume uma role da AWS na hora do deploy.
# Nenhuma chave de acesso é guardada em secret — chave estática em repositório
# é a que vaza, e a que ninguém lembra de rotacionar.
#
# Variáveis e segredos esperados (Settings → Secrets and variables → Actions):
#   vars.AWS_REGION                  ex.: us-east-1
#   vars.S3_BUCKET                   nome do bucket (privado)
#   vars.CLOUDFRONT_DISTRIBUTION_ID  id da distribuição
#   vars.EMBED_ALLOWED_ORIGINS       lista separada por vírgula
#   secrets.AWS_DEPLOY_ROLE_ARN      role com permissão de s3:Sync e de invalidar

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: true

permissions:
  id-token: write # exigido pelo OIDC
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        env:
          # A allowlist é de BUILD, não de runtime: o Vite grava o valor no
          # bundle. Mudar as origens exige um deploy novo — o que é bom, porque
          # transforma "quem pode falar com os jogos" numa mudança revisável.
          VITE_EMBED_ALLOWED_ORIGINS: ${{ vars.EMBED_ALLOWED_ORIGINS }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Dois syncs, e a ordem importa. Os assets têm hash no nome e são
      # imutáveis; o index.html não pode ser cacheado, senão o navegador serve
      # um HTML velho apontando para assets que já não existem — tela branca.
      # Subir os assets ANTES do index garante que todo HTML publicado já
      # encontre o que ele pede.
      - name: Assets (cache longo)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: index.html (sem cache)
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidar o CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
